<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اسپادانا وب</title>
    <link rel="stylesheet" href="assets/css/style.css">
  </head>

  <body>
    <div class="container">
       <header id="Header">
      <div>
        <img class="logo" src="assets/images/logo.svg" alt="" />
      </div>

      <nav class="menu">
        <ul>
          <li><a href="">خدمات</a></li>
          <li><a href="">مشتریان</a></li>
          <li><a href="">نمونه کار</a></li>
          <li><a href="">درباره ما</a></li>
          <li><a href="">تماس با ما</a></li>
        </ul>
      </nav>

      <div>
         <button class="btn-p">شروع پروژه</button> 
      </div>

    </header>



    <main class="main">

      <section id="main-slider">
        <img  src="./assets/images/rafiki.svg" alt="">

        <div class="content-slider">

        <div class="titr-slider">
        <h2>راهکارهای دیجیتال برای رشد کسب و کار شما</h2>
        <p>با ترکیب فناوری، طراحی و بازاریابی دیجیتال
به شما کمک می‌کنیم برند خود را قدرتمندتر کنید.</p>
        </div>

        <div class="btn-slider">
          <button class="btn-Portfolio">نمونه کارها</button>
          <button class="btn-Services">مشاهده خدمات</button>
        </div>

        </div>


      </section>


      <section id="Statistics">
        <div class="stat-items">
          <span class="stat-numbers">+10</span>
          <span class="stat-txt">متخصص</span>
        </div>

        <div class="stat-items">
          <span class="stat-numbers">+6</span>
          <span class="stat-txt">سال تجربه</span>
        </div>

        <div class="stat-items">
          <span class="stat-numbers">+40</span>
          <span class="stat-txt">مشتری راضی</span>
        </div>

        <div class="stat-items">
          <span class="stat-numbers">+15</span>
          <span class="stat-txt">پروژه موفق</span>
        </div>



      </section>
    </main>
    <footer class="footer">Footer</footer>
    </div>
